{{- range .Values.models }}
{{- if .enabled }}
---
{{- $merged := mergeOverwrite (deepCopy $.Values.global) . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $merged.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "23"
  labels:
    {{- include "kube-ai-stack.serviceLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "kube-ai-stack.modelSelectorLabels" (dict "model" . "root" $) | nindent 4 }}
  ports:
    - name: http
      port: {{ $merged.service.port }}
      targetPort: http
{{- end }}
{{- end }}