{{- range .Values.models }}
{{- $merged := mergeOverwrite (deepCopy $.Values.global) . -}}
{{- if and .enabled $merged.zeroscaling.enabled }}
---
apiVersion: elasti.truefoundry.com/v1alpha1
kind: ElastiService
metadata:
  name: {{ .name }}
  namespace: {{ $merged.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.integrations.argocd.syncWave.autoscaling }}
  labels:
    {{- include "kube-ai-stack.modelLabels" (dict "model" . "root" $) | nindent 4 }}
spec:
  minTargetReplicas: {{ $merged.zeroscaling.minReplicas }}
  service: {{ .name }}
  cooldownPeriod: {{ $merged.zeroscaling.cooldownPeriod }}
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .name }}
  triggers:
    - type: prometheus
      metadata:
        query: {{ tpl $merged.zeroscaling.trigger.query . }}
        serverAddress: {{ $.Values.global.prometheusUrl }}
        threshold: "{{ $merged.zeroscaling.trigger.threshold }}"
{{- end }}
{{- end }}