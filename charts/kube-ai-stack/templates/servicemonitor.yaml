{{- range .Values.models }}
{{- if .enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "24"
  labels:
    {{- include "kube-ai-stack.modelLabels" (dict "model" . "root" $) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "kube-ai-stack.modelSelectorLabels" (dict "model" . "root" $) | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 300s
      scrapeTimeout: 300s
{{- end }}
{{- end }}