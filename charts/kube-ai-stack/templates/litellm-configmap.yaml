{{- if .Values.global.litellm.manage_config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ $.Values.global.litellmNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "22"
  labels:
    {{- include "kube-ai-stack.configMapLabels" . | nindent 4 }}
data:
  config.yaml: |
    {{- with .Values.global.litellm.config }}
    {{- toYaml (omit . "model_list") | nindent 4 }}
    {{- end }}
    model_list:
    {{- range .Values.models }}
    {{- if .enabled }}
    - model_name: {{ .name | quote }}
      litellm_params:
        model: {{ printf "openai/%s" .name | quote }}
        api_base: {{ printf "http://%s.%s.svc.cluster.local:%d/v1" .name $.Values.global.namespace (int $.Values.global.service.port) | quote }}
        api_key: "dummy"
        {{- if .litellm_params }}
        timeout: {{ .litellm_params.timeout | default 1800 }}
        stream_timeout: {{ .litellm_params.stream_timeout | default 1800 }}
        max_retries: {{ .litellm_params.max_retries | default 3 }}
        {{- $customParams := omit .litellm_params "timeout" "stream_timeout" }}
        {{- with $customParams }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        timeout: 1800
        stream_timeout: 1800
        max_retries: 3
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}