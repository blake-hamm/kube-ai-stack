{{- range .Values.models }}
{{- if .enabled }}
---
{{- $merged := mergeOverwrite (deepCopy $.Values.global) . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $merged.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.integrations.argocd.syncWave.deployment }}
  labels:
    {{- include "kube-ai-stack.modelLabels" (dict "model" . "root" $) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kube-ai-stack.modelSelectorLabels" (dict "model" . "root" $) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-ai-stack.modelSelectorLabels" (dict "model" . "root" $) | nindent 8 }}
    spec:
      tolerations:
{{- toYaml $merged.tolerations | nindent 8 }}
      nodeSelector:
{{- toYaml $merged.nodeSelector | nindent 8 }}
      containers:
        - name: {{ .name }}
          image: "{{ $merged.image.repository }}:{{ $merged.image.tag }}"
          imagePullPolicy: {{ $merged.image.pullPolicy }}
          args:
{{- toYaml $merged.args | nindent 12 }}
          env:
            - name: LLAMA_CACHE
              value: "/models/cache"
            - name: HF_HOME
              value: "/models/cache/huggingface"
{{- if .template }}
            - name: TEMPLATE_PATH
              value: "/prompt/templates"
{{- end }}
{{- if $merged.hfToken.enabled }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $merged.hfToken.secretName }}
                  key: {{ $merged.hfToken.secretKey }}
{{- end }}
          resources:
{{- toYaml $merged.resources | nindent 12 }}
          volumeMounts:
            - name: model-cache
              mountPath: /models/cache
{{- if .template }}
            - name: template-volume
              mountPath: /prompt/templates
              readOnly: true
{{- end }}
          ports:
            - containerPort: {{ $.Values.serverPresets.llamaCpp.defaultPort }}
              name: http
          startupProbe:
            httpGet:
              path: {{ $.Values.serverPresets.llamaCpp.healthPath }}
              port: {{ $.Values.serverPresets.llamaCpp.defaultPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 240
          readinessProbe:
            httpGet:
              path: {{ $.Values.serverPresets.llamaCpp.healthPath }}
              port: {{ $.Values.serverPresets.llamaCpp.defaultPort }}
            initialDelaySeconds: 0
            periodSeconds: 60
            timeoutSeconds: 15
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: {{ $.Values.serverPresets.llamaCpp.healthPath }}
              port: {{ $.Values.serverPresets.llamaCpp.defaultPort }}
            initialDelaySeconds: 120
            periodSeconds: 120
            timeoutSeconds: 20
            failureThreshold: 15
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: "{{ .name }}-cache"
{{- if .template }}
        - name: template-volume
          configMap:
            name: "{{ .name }}-template"
{{- end }}
{{- end }}
{{- end }}
